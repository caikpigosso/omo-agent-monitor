<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Monitor local dos projetos OmO: fluxo de agentes, instruções, comandos e controle.">
  <meta name="color-scheme" content="light dark">
  <title>Painel de agentes · OmO</title>
  <style>
    :root {
      color-scheme: light;
      --page:#f6f7f8; --surface:#ffffff; --sidebar:#fbfbfc; --subtle:#f3f4f6; --wash:#eceef1; --wash-strong:#e2e5e9;
      --ink:#15171c; --muted:#5b616c; --faint:#868c96; --line:#e3e5e9; --line-strong:#cfd3d9; --edge:#c3c8cf;
      --primary:#15171c; --primary-ink:#ffffff;
      --info:#1d5fd0; --info-wash:#e9f0fd; --success:#15784a; --success-wash:#e5f3eb;
      --warning:#8f5500; --warning-wash:#fbf1df; --danger:#bf3228; --danger-wash:#fcebe9; --danger-ink:#ffffff;
      --focus:#2f6fe4; --shadow-overlay:0 16px 48px rgb(15 17 21 / .16), 0 2px 8px rgb(15 17 21 / .08);
      --font:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      --fs-xs:12px; --fs-sm:13px; --fs-body:14px; --fs-lg:16px; --fs-title:20px; --fs-metric:22px;
      --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
      --r-sm:6px; --r-md:8px; --r-lg:12px; --r-pill:999px;
      --sidebar-w:248px; --panel-w:clamp(380px,30vw,600px); --target:32px;
      --node-w:200px; --node-h:136px; --node-gap-x:32px; --node-gap-y:12px;
      --dag-w:196px; --dag-h:116px; --dag-gap-x:40px;
      --focus-w:2px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --page:#0e0f11; --surface:#15171a; --sidebar:#121316; --subtle:#1b1d21; --wash:#22252a; --wash-strong:#2b2f35;
      --ink:#eceef2; --muted:#9ca2ac; --faint:#737983; --line:#262a30; --line-strong:#363b43; --edge:#3e444d;
      --primary:#eceef2; --primary-ink:#15171a;
      --info:#83b3ff; --info-wash:#17233a; --success:#62d394; --success-wash:#13291d;
      --warning:#f0c264; --warning-wash:#2c2411; --danger:#ff9189; --danger-wash:#341b1a; --danger-ink:#2a0d0b;
      --focus:#83b3ff; --shadow-overlay:0 16px 48px rgb(0 0 0 / .5), 0 2px 8px rgb(0 0 0 / .3);
    }
    *, *::before, *::after { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; font-family:var(--font); font-size:var(--fs-body); line-height:1.5; color:var(--ink); background:var(--page); overflow:hidden; -webkit-font-smoothing:antialiased; }
    button, input, select, textarea { font:inherit; color:inherit; }
    h1, h2, h3, p, ol { margin:0; }
    ol { padding:0; list-style:none; }
    a { color:inherit; }
    :focus-visible { outline:var(--focus-w) solid var(--focus); outline-offset:2px; }
    [hidden] { display:none !important; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
    .mono { font-family:var(--mono); }
    .muted { color:var(--muted); }
    .t { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
    svg.i { width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    svg.i.sm { width:14px; height:14px; }

    /* App shell: sidebar / main / detail. Each region owns its own scroll. */
    .app { display:grid; grid-template-columns:var(--sidebar-w) minmax(0,1fr); height:100vh; height:100dvh; }
    .app[data-detail="open"] { grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--panel-w); }
    .app > * { min-width:0; min-height:0; }

    /* Controls */
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--s2); min-height:var(--target); padding:0 var(--s3); border:1px solid var(--line-strong); border-radius:var(--r-md); background:var(--surface); font-weight:500; cursor:pointer; white-space:nowrap; text-decoration:none; }
    .btn:hover:not(:disabled) { background:var(--wash); }
    .btn:active:not(:disabled) { background:var(--wash-strong); }
    .btn:disabled { cursor:not-allowed; opacity:.45; }
    .btn.primary { background:var(--primary); color:var(--primary-ink); border-color:var(--primary); }
    .btn.primary:hover:not(:disabled) { background:var(--primary); opacity:.86; }
    .btn.danger { color:var(--danger); }
    .btn.danger:hover:not(:disabled) { background:var(--danger-wash); }
    .btn.danger-solid { background:var(--danger); color:var(--danger-ink); border-color:var(--danger); }
    .btn.danger-solid:hover:not(:disabled) { background:var(--danger); opacity:.86; }
    .icon-btn { display:inline-grid; place-items:center; width:var(--target); height:var(--target); border:0; border-radius:var(--r-md); background:transparent; color:var(--muted); cursor:pointer; flex:none; }
    .icon-btn:hover { background:var(--wash); color:var(--ink); }
    .field { width:100%; min-height:var(--target); padding:0 var(--s3); border:1px solid var(--line-strong); border-radius:var(--r-md); background:var(--surface); }
    .field::placeholder { color:var(--muted); }
    select.field { width:auto; padding-right:var(--s2); }
    textarea.field { display:block; min-height:76px; max-height:240px; padding:var(--s2) var(--s3); resize:vertical; line-height:1.45; }
    .field:disabled { background:var(--subtle); color:var(--muted); cursor:not-allowed; }

    /* Status chip: dot + text, never color alone */
    .chip { display:inline-flex; align-items:center; gap:6px; max-width:100%; padding:0 8px 0 7px; border-radius:var(--r-pill); font-size:var(--fs-xs); font-weight:500; line-height:20px; white-space:nowrap; background:var(--wash); color:var(--muted); flex:none; }
    .chip > span:last-child { overflow:hidden; text-overflow:ellipsis; }
    .dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; }
    [data-tone="info"] { --tone:var(--info); --tone-wash:var(--info-wash); }
    [data-tone="success"] { --tone:var(--success); --tone-wash:var(--success-wash); }
    [data-tone="warning"] { --tone:var(--warning); --tone-wash:var(--warning-wash); }
    [data-tone="danger"] { --tone:var(--danger); --tone-wash:var(--danger-wash); }
    .chip[data-tone]:not([data-tone="neutral"]) { background:var(--tone-wash); color:var(--tone); }
    .dot[data-live] { animation:pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity:.3; } }
    .spin { animation:spin 1s linear infinite; transform-origin:center; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .chev { transition:transform .15s ease; }

    /* Sidebar */
    .sidebar { display:flex; flex-direction:column; background:var(--sidebar); border-right:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:var(--s2); padding:var(--s4) var(--s4) var(--s3); min-height:56px; }
    .wordmark { font-weight:700; font-size:var(--fs-lg); letter-spacing:-.01em; }
    .brand-sep { width:1px; height:16px; background:var(--line-strong); }
    .brand-title { color:var(--muted); font-weight:500; }
    .conn { display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--muted); white-space:nowrap; }
    .conn[data-tone]:not([data-tone="neutral"]) { color:var(--tone); }
    .brand .conn { margin-left:auto; }
    .switcher-close { display:none; }
    .side-search { padding:0 var(--s3) var(--s2); }
    .side-label { display:flex; justify-content:space-between; padding:var(--s2) var(--s4) var(--s1); font-size:var(--fs-xs); font-weight:600; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; }
    .project-list { flex:1; overflow:auto; padding:var(--s1) var(--s2) var(--s3); display:flex; flex-direction:column; gap:2px; }
    .project { display:flex; flex-direction:column; gap:2px; padding:var(--s2) var(--s3); border-radius:var(--r-md); text-decoration:none; min-width:0; }
    .project:hover { background:var(--wash); }
    .project[aria-current="page"] { background:var(--wash-strong); }
    .p-row { display:flex; align-items:center; gap:var(--s2); min-width:0; }
    .p-name { font-weight:600; flex:1; }
    .p-check { visibility:hidden; color:var(--ink); }
    .project[aria-current="page"] .p-check { visibility:visible; }
    .p-cwd { font-family:var(--mono); font-size:var(--fs-xs); color:var(--muted); }
    .p-meta { display:flex; flex-wrap:wrap; align-items:center; gap:2px var(--s2); font-size:var(--fs-xs); color:var(--muted); }
    .p-meta [data-tone]:not([data-tone="neutral"]) { color:var(--tone); }
    .p-online { display:inline-flex; align-items:center; gap:5px; }
    .side-empty { padding:var(--s4); color:var(--muted); font-size:var(--fs-sm); }
    .side-foot { border-top:1px solid var(--line); padding:var(--s3) var(--s4); display:flex; align-items:center; justify-content:space-between; gap:var(--s2); font-size:var(--fs-sm); color:var(--muted); }

    /* Main */
    .main { overflow:auto; position:relative; }
    .mobile-bar { display:none; }
    .view { max-width:1440px; margin:0 auto; padding:var(--s6); display:flex; flex-direction:column; gap:var(--s4); }
    .phead { display:flex; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; gap:var(--s3) var(--s6); }
    .phead-main { min-width:0; flex:1 1 320px; }
    .phead-title { display:flex; align-items:center; flex-wrap:wrap; gap:var(--s2) var(--s3); }
    .phead h1 { font-size:var(--fs-title); line-height:1.3; font-weight:650; letter-spacing:-.01em; overflow-wrap:anywhere; }
    .phead-cwd { font-family:var(--mono); font-size:var(--fs-sm); color:var(--muted); overflow-wrap:anywhere; margin-top:2px; }
    .coord-link { display:inline-flex; align-items:center; flex-wrap:wrap; gap:var(--s2); min-height:var(--target); max-width:100%; padding:var(--s1) var(--s2) var(--s1) var(--s3); border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface); text-decoration:none; }
    .coord-link:hover { background:var(--wash); }
    .coord-link .lbl { font-weight:600; }
    .coord-link .mono { font-size:var(--fs-sm); color:var(--muted); overflow-wrap:anywhere; }
    .notice { display:flex; gap:var(--s2); align-items:flex-start; padding:var(--s2) var(--s3); border-radius:var(--r-md); font-size:var(--fs-sm); background:var(--warning-wash); color:var(--warning); overflow-wrap:anywhere; }
    .notice[data-tone="danger"] { background:var(--danger-wash); color:var(--danger); }
    .notice svg { margin-top:2px; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:var(--s3); }
    .quota { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s1) var(--s2); font-size:var(--fs-sm); color:var(--muted); margin-top:var(--s2); }
    .quota strong { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
    .metric { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:var(--s3) var(--s4); min-width:0; }
    .m-label { font-size:var(--fs-xs); color:var(--muted); font-weight:500; }
    .m-value { font-size:var(--fs-metric); font-weight:600; line-height:1.3; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
    .m-value[data-tone]:not([data-tone="neutral"]) { color:var(--tone); }
    .m-value.sm { font-size:var(--fs-lg); line-height:1.6; }
    .m-sub { font-size:var(--fs-xs); color:var(--muted); }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); min-width:0; }
    .panel-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:var(--s1) var(--s3); padding:var(--s3) var(--s4); border-bottom:1px solid var(--line); }
    .panel-head h2 { font-size:var(--fs-body); font-weight:600; }
    .panel-note { font-size:var(--fs-xs); color:var(--muted); }
    .flow-scroll { overflow-x:auto; overflow-y:hidden; padding:var(--s4); overscroll-behavior-x:contain; }
    .flow { position:relative; }
    .flow svg.edges { position:absolute; inset:0; overflow:visible; pointer-events:none; }
    .edges path { fill:none; stroke:var(--edge); stroke-width:1.5; }
    .edges path.live { stroke:var(--info); stroke-dasharray:4 4; }
    .edges path.on { stroke:var(--muted); stroke-width:2; stroke-dasharray:none; }
    .flow-empty { padding:0 var(--s4) var(--s4); color:var(--muted); font-size:var(--fs-sm); max-width:60ch; }
    .node { position:absolute; display:flex; flex-direction:column; gap:3px; padding:10px 12px; text-align:left; background:var(--surface); border:1px solid var(--line-strong); border-radius:var(--r-lg); overflow:hidden; font-size:var(--fs-sm); }
    button.node { cursor:pointer; }
    button.node:hover { background:var(--subtle); }
    .node[aria-pressed="true"] { background:var(--wash); border-color:var(--muted); }
    .node.coord { background:var(--subtle); }
    .n-name { display:flex; align-items:center; gap:6px; font-weight:600; font-size:var(--fs-body); min-width:0; }
    .n-name .t { flex:1; }
    .n-check { visibility:hidden; }
    .node[aria-pressed="true"] .n-check { visibility:visible; }
    .n-row { display:flex; align-items:center; gap:6px; min-width:0; color:var(--muted); font-size:var(--fs-xs); }
    .n-row.mono { font-size:11.5px; }
    .n-live { color:var(--info); font-family:var(--mono); font-size:11.5px; }
    .n-stats { margin-top:auto; display:flex; gap:10px; color:var(--muted); font-size:var(--fs-xs); font-variant-numeric:tabular-nums; min-width:0; }
    .n-stats > span { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
    .dag + .dag { border-top:1px solid var(--line); }
    .dag-head { display:flex; align-items:center; flex-wrap:wrap; gap:var(--s2) var(--s3); padding:var(--s3) var(--s4) 0; }
    .dag-head h3 { font-size:var(--fs-body); font-weight:600; overflow-wrap:anywhere; }
    .dag-warn { padding:0 var(--s4) var(--s3); color:var(--warning); font-size:var(--fs-xs); }
    .dnode .n-row:last-child { margin-top:auto; }

    /* Detail panel */
    .detail { display:flex; flex-direction:column; background:var(--surface); border-left:1px solid var(--line); }
    .d-head { padding:var(--s3) var(--s4); border-bottom:1px solid var(--line); }
    .d-top { display:flex; align-items:center; gap:var(--s2); min-height:var(--target); }
    .d-kind { font-size:var(--fs-xs); font-weight:600; color:var(--muted); letter-spacing:.03em; text-transform:uppercase; }
    .d-top .icon-btn { margin-left:auto; }
    .d-head h2 { font-size:var(--fs-lg); font-weight:600; line-height:1.35; overflow-wrap:anywhere; }
    .d-head h2:focus { outline:none; }
    .d-head h2:focus-visible { outline:var(--focus-w) solid var(--focus); }
    .d-meta { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s1) var(--s3); margin-top:var(--s2); font-size:var(--fs-sm); color:var(--muted); }
    .d-meta > span, .d-meta > a { display:inline-flex; align-items:center; gap:5px; min-width:0; overflow-wrap:anywhere; }
    .d-now { display:flex; gap:6px; align-items:center; margin-top:var(--s2); color:var(--info); font-family:var(--mono); font-size:var(--fs-xs); min-width:0; }
    .tabs { display:flex; gap:var(--s1); padding:0 var(--s3); border-bottom:1px solid var(--line); overflow-x:auto; }
    .tab { position:relative; min-height:40px; padding:0 var(--s3); border:0; background:none; color:var(--muted); font-weight:500; cursor:pointer; white-space:nowrap; }
    .tab:hover { color:var(--ink); }
    .tab[aria-selected="true"] { color:var(--ink); }
    .tab[aria-selected="true"]::after { content:""; position:absolute; left:var(--s2); right:var(--s2); bottom:-1px; height:2px; border-radius:2px; background:var(--ink); }
    .a-tools { display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); padding:var(--s2) var(--s4); border-bottom:1px solid var(--line); }
    .seg { display:inline-flex; padding:2px; background:var(--wash); border-radius:var(--r-md); }
    .seg button { border:0; background:none; min-height:28px; padding:0 var(--s3); border-radius:6px; color:var(--muted); font-size:var(--fs-sm); cursor:pointer; }
    .seg button:hover { color:var(--ink); }
    .seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line-strong); }
    .a-search { flex:1 1 140px; min-width:0; }
    .a-search .field { min-height:32px; }
    .a-count { font-size:var(--fs-xs); color:var(--muted); width:100%; }
    .d-body { flex:1; overflow:auto; padding:var(--s3) var(--s4) var(--s4); overscroll-behavior:contain; }
    .pinned { border:1px solid var(--line); border-radius:var(--r-lg); background:var(--subtle); margin-bottom:var(--s3); }
    .pinned summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:auto auto minmax(0,1fr); align-items:center; gap:var(--s2); min-height:40px; padding:var(--s1) var(--s3); border-radius:var(--r-lg); }
    .pinned summary::-webkit-details-marker { display:none; }
    .pinned[open] > summary .chev, .tool-row[aria-expanded="true"] .chev { transform:rotate(90deg); }
    .pin-preview { color:var(--muted); font-size:var(--fs-sm); }
    .pinned[open] .pin-preview { visibility:hidden; }
    .pin-body, .prose { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; }
    .pin-body { padding:0 var(--s3) var(--s3); }
    .pane-head { display:flex; justify-content:space-between; gap:var(--s2); flex-wrap:wrap; font-size:var(--fs-xs); color:var(--muted); margin-bottom:var(--s2); }
    .tl { display:flex; flex-direction:column; gap:2px; }
    .ev-msg { padding:var(--s2) 0; }
    .ev-head { display:flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--muted); margin-bottom:3px; }
    .ev-head strong { color:var(--ink); font-size:var(--fs-sm); font-weight:600; }
    .ev-head time { margin-left:auto; font-variant-numeric:tabular-nums; }
    .ev-text { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; }
    .ev-msg[data-kind="user"] .ev-text, .ev-msg[data-kind="instruction"] .ev-text { background:var(--subtle); border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s2) var(--s3); }
    .ev-think, .ev-sys { display:flex; align-items:center; gap:6px; padding:3px var(--s2); color:var(--muted); font-size:var(--fs-sm); min-width:0; }
    .ev-think { font-style:italic; }
    .ev-think time, .ev-sys time { margin-left:auto; font-size:var(--fs-xs); font-style:normal; font-variant-numeric:tabular-nums; }
    .tool-row { position:relative; display:grid; grid-template-columns:16px auto minmax(0,1fr) auto 14px; align-items:center; gap:var(--s2); width:100%; min-height:32px; padding:4px var(--s2); border:1px solid transparent; border-radius:var(--r-md); background:none; text-align:left; cursor:pointer; font-size:var(--fs-sm); }
    .tool-row:hover { background:var(--subtle); }
    .tool[data-open] > .tool-row { background:var(--subtle); border-color:var(--line); }
    .t-icon { display:grid; place-items:center; }
    .t-name { font-family:var(--mono); font-weight:600; font-size:12.5px; white-space:nowrap; }
    .t-sum { font-family:var(--mono); font-size:12.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .t-dur { font-size:var(--fs-xs); color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .tool[data-state="ok"] .t-icon { color:var(--success); }
    .tool[data-state="running"] .t-icon, .tool[data-state="running"] .t-dur { color:var(--info); }
    .tool[data-state="error"] > .tool-row { background:var(--danger-wash); }
    .tool[data-state="error"] .t-icon, .tool[data-state="error"] .t-name, .tool[data-state="error"] .t-dur { color:var(--danger); }
    .tool-body { margin:var(--s1) 0 var(--s2) 26px; display:flex; flex-direction:column; gap:var(--s2); min-width:0; }
    .tb-meta { font-size:var(--fs-xs); color:var(--muted); overflow-wrap:anywhere; }
    .tb-label { display:flex; align-items:center; gap:var(--s2); font-size:var(--fs-xs); font-weight:600; color:var(--muted); margin-bottom:var(--s1); }
    .tb-label[data-tone="danger"] { color:var(--danger); }
    .code { margin:0; padding:var(--s2) var(--s3); background:var(--subtle); border:1px solid var(--line); border-radius:var(--r-md); font-family:var(--mono); font-size:12.5px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .code[data-error] { background:var(--danger-wash); border-color:var(--danger); }
    .linkish { align-self:flex-start; border:0; background:none; padding:var(--s1) 0; color:var(--info); font-size:var(--fs-sm); font-weight:500; cursor:pointer; min-height:var(--target); }
    .linkish:hover { text-decoration:underline; }
    .tb-note { font-size:var(--fs-xs); color:var(--muted); }

  <script>
    'use strict';

    const num = v => Number.isFinite(v) ? nf.format(v) : '—';
    const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
    const compact = v => Number.isFinite(v) ? cf.format(v) : '—';
    const ms = iso => { const t = Date.parse(iso); return Number.isFinite(t) ? t : null; };

      const s = Math.round(v / 1000);

    const cssPx = (name, fallback) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(name)) || fallback;

    /* ---------- routing: #/p/<projectId>[/t/<taskId>|/c] ---------- */

    /* ---------- data intake ---------- */
    function acceptProjects(snap) {
      if (!snap || !Number.isFinite(snap.revision) || !Array.isArray(snap.projects)) return;

      const newHub = app.projects && snap.controlToken !== app.projects.controlToken;

    /* ---------- agent flow (tree layout + SVG edges) ---------- */
    function flowPanel(pid, st) {

    function buildFlow(pid, st) {

      const coord = st.parents?.[0] || {};

      // Tasks caught in a parent cycle are unreachable from the coordinator: re-attach them to it.
      const seen = new Set();
      const mark = key => { for (const t of kids.get(key)) if (!seen.has(t.id)) { seen.add(t.id); mark(kOf(t)); } };
      mark('c');
      for (const t of tasks) if (!seen.has(t.id)) {
        for (const list of kids.values()) { const i = list.indexOf(t); if (i >= 0) list.splice(i,1); }
        kids.get('c').push(t); seen.add(t.id); mark(kOf(t));

        const list = kids.get(key) || [];

      const narrow = matchMedia('(max-width:760px)').matches, IND = 20;
      if (narrow) order.forEach((key,i) => pos.set(key,{x:depthOf.get(key) * IND,y:i * (H + GY)}));
      const width = (maxDepth + 1) * (W + GX) - GX;
      const height = narrow ? order.length * (H + GY) - GY : Math.max(cursor - GY,H);

      if (!narrow) svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      const selected = app.route.pid === pid ? nodeKey(app.route) : null;
      const onPath = new Set();
      for (let k = selected; k && pos.has(k); k = parentOf.get(k)) onPath.add(k);
      for (const key of order) {
        const parent = parentOf.get(key);

        const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x, y2 = b.y + H / 2, mx = (x1 + x2) / 2;
        const path = document.createElementNS(NS,'path');
        path.setAttribute('d',narrow ? `M ${a.x + 12} ${a.y + H} V ${y2} H ${x2}` : `M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`);
        const t = byId.get(key.slice(2));
        path.setAttribute('class',onPath.has(key) ? 'on' : !narrow && t?.status === 'running' ? 'live' : '');
        svg.append(path);
      }
      wrap.append(svg);
      for (const key of order) {
        const node = key === 'c' ? coordNode(coord,tasks,kids.get('c').length) : taskNode(byId.get(key.slice(2)));
        const p = pos.get(key);
        node.style.left = p.x + 'px'; node.style.top = p.y + 'px';
        node.style.width = narrow ? `calc(100% - ${p.x}px)` : W + 'px'; node.style.height = H + 'px';

    const events = new EventSource('/api/events');
    events.addEventListener('open',() => { app.stream = 'open'; renderConnection(); });
    events.addEventListener('error',() => { app.stream = 'error'; renderConnection(); });
    function streamEvent(handler) {
      return event => {
        let data;
        try { data = JSON.parse(event.data); }
        catch { app.eventError = `O hub enviou um evento “${event.type}” inválido; aguardando o próximo.`; renderMain(); return; }
        if (app.eventError) { app.eventError = ''; renderMain(); }
        handler(data);
      };
    }
    events.addEventListener('projects',streamEvent(acceptProjects));
    events.addEventListener('state',streamEvent(m => acceptState(m?.projectId,m?.state)));
    events.addEventListener('activity',streamEvent(handleActivity));
    if (detailTarget()) openDetail();
    loadProjects();
    window.addEventListener('pagehide',() => { events.close(); detail.ctrl?.abort(); },{once:true});
  </script>
</body>
</html>
